name: sesame
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      network: host
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ENTERPRISE_AI_URL: ${ENTERPRISE_AI_URL}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_MODE: ${REDIS_MODE:-single}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PREFIX: ${REDIS_PREFIX:-sesame:}
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-}
      VALIDATE_COOKIE_ON_SUBMIT: ${VALIDATE_COOKIE_ON_SUBMIT:-false}
      VALIDATE_COOKIE_URL: ${VALIDATE_COOKIE_URL:-}
      DEFAULT_COOKIE_EXPIRE_DAYS: ${DEFAULT_COOKIE_EXPIRE_DAYS:-7}
      SSO_LOGIN_URL: ${SSO_LOGIN_URL:-}
      SSO_USERNAME_FIELD: ${SSO_USERNAME_FIELD:-username}
      SSO_PASSWORD_FIELD: ${SSO_PASSWORD_FIELD:-password}
      SSO_EXTRA_FIELDS: ${SSO_EXTRA_FIELDS:-}
    ports:
      - "10005:8000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      network: host
    restart: unless-stopped
    ports:
      - "10006:80"
    depends_on:
      - backend
